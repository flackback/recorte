<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Recorte</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      body.area {
        cursor: crosshair;
      }

      .panel {
        position: fixed;
        top: 16px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px;
        border-radius: 999px;
        background: rgb(28 28 30 / 0.92);
        color: #f2f2f4;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
        transform: translateX(-50%);
      }

      .panel .hint {
        padding: 0 10px;
        color: #c7c7cc;
      }

      .panel button {
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .panel button:hover {
        background: rgb(255 255 255 / 0.12);
      }

      .panel .primary {
        background: #0a84ff;
        font-weight: 600;
      }

      .size {
        position: fixed;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.75);
        color: #fff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }

      body.draw {
        cursor: crosshair;
      }

      body.draw[data-tool="text"] {
        cursor: text;
      }

      .text-input {
        position: fixed;
        min-width: 40px;
        margin: 0;
        padding: 0;
        border: 0;
        border-bottom: 2px dashed currentColor;
        outline: none;
        background: transparent;
        font-weight: 700;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        line-height: 1;
        text-shadow: 0 1px 8px rgb(0 0 0 / 0.45);
        field-sizing: content;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" src="/src/overlay-app.ts" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="panel" id="area-panel" hidden>
      <span class="hint">Arraste para escolher a área · <b>Enter</b> confirma · <b>Esc</b> cancela</span>
      <button id="area-full">Tela inteira</button>
      <button class="primary" id="area-ok">Gravar área</button>
    </div>
    <span class="size" id="size" hidden></span>

    <input class="text-input" id="text-input" hidden maxlength="120" spellcheck="false" aria-label="Texto na tela" />
  </body>
</html>
