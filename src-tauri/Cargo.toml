[package]
name = "recorte"
version = "0.1.18"
description = "Gravador de tela e editor para Windows (protótipo)"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recorte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2.0.1"
wasapi = "0.26.0"
hound = "3.5.1"
anyhow = "1.0.104"
chrono = "0.4.45"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet3 with its model built in; the crates.io release is older and has no tract backend.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
# The version deep_filter takes its frames in.
ndarray = "0.15"
tauri-plugin-global-shortcut = "2.4.1"
trash = "5.2.9"
tiny_http = "0.12"
# The same WebView2 bindings Tauri uses, to manage the page's camera and microphone permission.
webview2-com = "0.39"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
rquickjs = "0.14.0"
dirs = "7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The MCP server runs in QuickJS; unoptimized, it answers several times slower even in development.
[profile.dev.package.rquickjs-sys]
opt-level = 3
